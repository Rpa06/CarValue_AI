{% extends "base.html" %}
{% block contenido %}
<section class="card">
  <h2>Estimar el precio de un coche usado</h2>
  <p>Indica sus características y adjunta una fotografía exterior para estimar su estado.</p>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}

  <form action="/tasar" method="post" enctype="multipart/form-data">
    <div class="grid">
      <div>
        <label for="manufacturer">Marca</label>
        <select id="manufacturer" name="manufacturer" required>
          <option value="" selected disabled>Selecciona una marca</option>
          {% for marca in opciones.marcas %}
            <option value="{{ marca }}">{{ marca }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="year">Año</label>
        <input id="year" name="year" type="number" min="1995" max="2021" required>
      </div>
      <div>
        <label for="odometer">Kilometraje (millas)</label>
        <input id="odometer" name="odometer" type="number" min="1000" max="250000" required>
      </div>
      <div>
        <label for="fuel">Combustible</label>
        <select id="fuel" name="fuel" required>
          <option value="" selected disabled>Selecciona un combustible</option>
          {% for combustible in opciones.combustibles %}
            <option value="{{ combustible }}">{{ combustible }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="type">Tipo de vehículo</label>
        <select id="type" name="type" required>
          <option value="" selected disabled>Selecciona un tipo</option>
          {% for tipo in opciones.tipos %}
            <option value="{{ tipo }}">{{ tipo }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="transmission">Transmisión</label>
        <select id="transmission" name="transmission" required>
          <option value="" selected disabled>Selecciona una transmisión</option>
          {% for transmision in opciones.transmisiones %}
            <option value="{{ transmision }}">{{ transmision }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="foto">Fotografía del vehículo</label>
        <input id="foto" name="foto" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" required>
        <p class="hint">Formatos admitidos: JPG, PNG o WEBP.</p>
      </div>
    </div>
    <p><button type="submit">Estimar precio</button></p>
  </form>

</section>
{% endblock %}
